<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" data-palette="e656af-e76a74-f6acf5-2657acc483b5" role="img" aria-labelledby="process-light-t process-light-d"><title id="process-light-t">deadend-ledger process</title><desc id="process-light-d">The agent skips the tombstoned approach instead of re-walking it.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="470"><stop stop-color="#b9458d"/><stop offset=".55" stop-color="#b4525a"/><stop offset="1" stop-color="#8d638d"/></linearGradient><radialGradient id="halo"><stop stop-color="#b9458d" stop-opacity=".2"/><stop offset="1" stop-color="#fef9fc" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#f7cbe6" stroke-opacity=".3" stroke-width=".6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#b9458d" stroke-width="1.4"/></marker></defs><style>text{font-family:Arial,'Noto Sans','PingFang SC',sans-serif}.flow{stroke-dasharray:8 96;animation:flow 5.5s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-312}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="470" rx="16" fill="#fef9fc"/><rect width="1000" height="470" rx="16" fill="url(#grid)"/><ellipse cx="620.0" cy="211.5" rx="500.0" ry="338.4" fill="url(#halo)"/><text x="44" y="44" fill="#725e7d" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM FAILURE TO SKIP</text><text x="44" y="84.0" fill="#271628" font-size="26" text-anchor="start" font-weight="600">From failure to skip, in four moves</text><path d="M70 250H930" stroke="#f7cbe6"/><circle cx="160" cy="250" r="15" fill="#fef7fb" stroke="#b9458d"/><text x="160" y="255" fill="#b9458d" font-size="13" text-anchor="middle" font-weight="700">01</text><circle class="pulse" cx="160" cy="250" r="4" fill="#8d638d"/><rect x="55" y="102" width="210" height="120" rx="10" fill="#fef7fb" stroke="#f7cbe6" stroke-width="1"/><text x="71" y="132.0" fill="#271628" font-size="19" text-anchor="start" font-weight="600">Record the dead</text><text x="71" y="158.98" fill="#271628" font-size="19" text-anchor="start" font-weight="600">end</text><text x="71" y="177.0" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">approach · scope ·</text><text x="71" y="198.3" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">evidence locator</text><path d="M160 222V235" stroke="#f7cbe6" stroke-dasharray="3 5"/><circle cx="387" cy="250" r="15" fill="#fef7fb" stroke="#b9458d"/><text x="387" y="255" fill="#b9458d" font-size="13" text-anchor="middle" font-weight="700">02</text><circle class="pulse" cx="387" cy="250" r="4" fill="#8d638d"/><rect x="282" y="278" width="210" height="120" rx="10" fill="#fef7fb" stroke="#f7cbe6" stroke-width="1"/><text x="298" y="308.0" fill="#271628" font-size="19" text-anchor="start" font-weight="600">Validate and</text><text x="298" y="334.98" fill="#271628" font-size="19" text-anchor="start" font-weight="600">append</text><text x="298" y="353.0" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">schema-checked JSONL</text><text x="298" y="374.3" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">line</text><path d="M387 265V278" stroke="#f7cbe6" stroke-dasharray="3 5"/><circle cx="614" cy="250" r="15" fill="#fef7fb" stroke="#b9458d"/><text x="614" y="255" fill="#b9458d" font-size="13" text-anchor="middle" font-weight="700">03</text><circle class="pulse" cx="614" cy="250" r="4" fill="#8d638d"/><rect x="509" y="102" width="210" height="120" rx="10" fill="#fef7fb" stroke="#f7cbe6" stroke-width="1"/><text x="525" y="132.0" fill="#271628" font-size="19" text-anchor="start" font-weight="600">Score at session</text><text x="525" y="158.98" fill="#271628" font-size="19" text-anchor="start" font-weight="600">start</text><text x="525" y="177.0" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">deterministic token</text><text x="525" y="198.3" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">overlap, constant…</text><path d="M614 222V235" stroke="#f7cbe6" stroke-dasharray="3 5"/><circle cx="841" cy="250" r="15" fill="#fef7fb" stroke="#b9458d"/><text x="841" y="255" fill="#b9458d" font-size="13" text-anchor="middle" font-weight="700">04</text><circle class="pulse" cx="841" cy="250" r="4" fill="#8d638d"/><rect x="736" y="278" width="210" height="120" rx="10" fill="#fef7fb" stroke="#f7cbe6" stroke-width="1"/><text x="752" y="308.0" fill="#271628" font-size="19" text-anchor="start" font-weight="600">Inject or stay</text><text x="752" y="334.98" fill="#271628" font-size="19" text-anchor="start" font-weight="600">silent</text><text x="752" y="353.0" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">matched block under a</text><text x="752" y="374.3" fill="#725e7d" font-size="15" text-anchor="start" font-weight="400">hard cap; no match…</text><path d="M841 265V278" stroke="#f7cbe6" stroke-dasharray="3 5"/><text x="500" y="420" fill="#8d638d" font-size="19" text-anchor="middle" font-weight="600">The agent skips the tombstoned approach instead of re-walking it.</text><text x="500" y="448" fill="#725e7d" font-size="14" text-anchor="middle" font-weight="400">unaffected tasks are untouched: no match, zero bytes out</text></svg>
