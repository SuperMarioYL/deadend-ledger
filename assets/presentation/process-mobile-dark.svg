<svg xmlns="http://www.w3.org/2000/svg" width="400" height="812" viewBox="0 0 400 812" data-palette="e656af-e76a74-f6acf5-2657acc483b5" role="img" aria-labelledby="process-mobile-dark-t process-mobile-dark-d"><title id="process-mobile-dark-t">deadend-ledger process</title><desc id="process-mobile-dark-d">The agent skips the tombstoned approach instead of re-walking it.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="812"><stop stop-color="#e656af"/><stop offset=".55" stop-color="#e76a74"/><stop offset="1" stop-color="#f6acf5"/></linearGradient><radialGradient id="halo"><stop stop-color="#e656af" stop-opacity=".2"/><stop offset="1" stop-color="#0a0710" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#3a1833" stroke-opacity=".3" stroke-width=".6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656af" stroke-width="1.4"/></marker></defs><style>text{font-family:Arial,'Noto Sans','PingFang SC',sans-serif}.flow{stroke-dasharray:8 96;animation:flow 5.5s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.bob{animation:bob 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-312}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="812" rx="16" fill="#0a0710"/><rect width="400" height="812" rx="16" fill="url(#grid)"/><ellipse cx="248.0" cy="365.40000000000003" rx="200.0" ry="584.64" fill="url(#halo)"/><text x="28" y="44" fill="#b29cb9" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM FAILURE TO SKIP</text><text x="28" y="84.0" fill="#fdeefd" font-size="23" text-anchor="start" font-weight="600">From failure to skip, in</text><text x="28" y="116.66" fill="#fdeefd" font-size="23" text-anchor="start" font-weight="600">four moves</text><path d="M200 228V280" fill="none" stroke="#e656af" stroke-width="1.4" marker-end="url(#arr)"/><path d="M200 228V280" class="flow" fill="none" stroke="#f6acf5" stroke-width="2"/><rect x="28" y="128" width="344" height="100" rx="10" fill="#13101c" stroke="#3a1833" stroke-width="1"/><text x="44" y="158.0" fill="#fdeefd" font-size="19" text-anchor="start" font-weight="600">01  Record the dead end</text><text x="44" y="176.0" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">approach · scope · evidence locator</text><path d="M200 380V432" fill="none" stroke="#e656af" stroke-width="1.4" marker-end="url(#arr)"/><path d="M200 380V432" class="flow" fill="none" stroke="#f6acf5" stroke-width="2"/><rect x="28" y="280" width="344" height="100" rx="10" fill="#13101c" stroke="#3a1833" stroke-width="1"/><text x="44" y="310.0" fill="#fdeefd" font-size="19" text-anchor="start" font-weight="600">02  Validate and append</text><text x="44" y="328.0" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">schema-checked JSONL line</text><path d="M200 532V584" fill="none" stroke="#e656af" stroke-width="1.4" marker-end="url(#arr)"/><path d="M200 532V584" class="flow" fill="none" stroke="#f6acf5" stroke-width="2"/><rect x="28" y="432" width="344" height="100" rx="10" fill="#13101c" stroke="#3a1833" stroke-width="1"/><text x="44" y="462.0" fill="#fdeefd" font-size="19" text-anchor="start" font-weight="600">03  Score at session start</text><text x="44" y="480.0" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">deterministic token overlap, constant</text><text x="44" y="501.3" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">threshold</text><rect x="28" y="584" width="344" height="100" rx="10" fill="#13101c" stroke="#3a1833" stroke-width="1"/><text x="44" y="614.0" fill="#fdeefd" font-size="19" text-anchor="start" font-weight="600">04  Inject or stay silent</text><text x="44" y="632.0" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">matched block under a hard cap; no</text><text x="44" y="653.3" fill="#b29cb9" font-size="15" text-anchor="start" font-weight="400">match, zero bytes</text><text x="28" y="772" fill="#f6acf5" font-size="17" text-anchor="start" font-weight="600">The agent skips the tombstoned approach instead of re-walking it.</text><text x="28" y="796" fill="#b29cb9" font-size="13" text-anchor="start" font-weight="400">unrelated task: zero bytes out</text></svg>
